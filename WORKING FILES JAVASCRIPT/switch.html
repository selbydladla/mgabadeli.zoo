<html>
<head>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <label for="wellbeing">how are you feeling today?</label>
    <select id="wellbeing" onchange="displayMessage()">
        <option value="happy">happy</option>
        <option value="sad">sad</option>
        <option value="angry">angry</option>
        <option value="confused">confused</option>
    </select>
    <a href="javascript:void(0);" onclick="btnPressed()">GO!</a>
    <p id="outpuText">speak how you feel</p>
</body>
    
    <script>
        function btnPressed() {
            var wellbeing = document.getElementById("wellbeing").value;
            var outputText = document.getElementById("outpuText");
            
            if (wellbeing === "happy") {
                outputText.innerHTML = "I'm glad to hear that!";
            } else if (wellbeing === "sad") {
                outputText.innerHTML = "It's okay to feel sad sometimes.";
            } else if (wellbeing === "angry") {
                outputText.innerHTML = "Take a deep breath, it's going to be okay.";
            } else if (wellbeing === "confused") {
                outputText.innerHTML = "It's normal to feel confused at times.";
            }
        }
    </script>
</body>
</html>
